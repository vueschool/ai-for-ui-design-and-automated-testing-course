coreValues:
  title: Our Core Values
  subtitle: The principles that guide every interaction and decision at Mentora.
  values:
    - icon: i-lucide-graduation-cap
      title: Excellence in Education
      description: We are committed to the highest standards of teaching and learning, ensuring every student receives quality instruction from verified experts.
    - icon: i-lucide-graduation-cap
      title: Personalized Learning
      description: Every student is unique. We tailor our approach to match individual learning styles, goals, and pace for maximum growth.
    - icon: i-lucide-graduation-cap
      title: Innovation First
      description: We continuously evolve our methods and platform to incorporate the latest in educational research and technology.
    - icon: i-lucide-graduation-cap
      title: Empathy & Support
      description: We create a supportive environment where students feel safe to ask questions, make mistakes, and grow with confidence.

story:
  title: Our Story
  paragraphs:
    - Mentora was founded in 2015 by a group of passionate educators who saw too many students struggling with one-size-fits-all teaching. We believed there had to be a better way—one that honored each learner's unique potential.
    - What started as a small local tutoring center in Boston quickly grew as word spread about our personalized, mentorship-driven approach. Students who had once felt left behind began to thrive, and their families took notice.
    - Today, Mentora has grown into a global platform connecting students with expert tutors across subjects and time zones. Our founding belief remains at the heart of everything we do—with the right guidance, every student can excel.

